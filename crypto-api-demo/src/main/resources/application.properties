spring.application.name=crypto-api-demo

app-attest.app-id=${APP_ATTEST_APP_ID:}

app-attest.environment=${APP_ATTEST_ENVIRONMENT:production}

app-attest.root-certificate=classpath:apple-app-attest-root.pem

app-attest.aes-key=${APP_ATTEST_AES_KEY:}
play-integrity.package-name=${PLAY_INTEGRITY_PACKAGE_NAME:}
play-integrity.certificate-sha256=${PLAY_INTEGRITY_CERTIFICATE_SHA256:}
play-integrity.password-base64=${PLAY_INTEGRITY_PASSWORD_BASE64:}
play-integrity.requests-per-minute=${PLAY_INTEGRITY_REQUESTS_PER_MINUTE:60}
