spring.application.name=crypto-api-demo

# App Attest: identidad de la app firmada, no solo el bundle identifier.
# APP_ATTEST_APP_ID=<App ID prefix real>.com.encryptKeyTest
# El target iOS usa actualmente Team ID 55ZZYY7ZAD. Si coincide con el
# application-identifier del provisioning profile, usar 55ZZYY7ZAD.com.encryptKeyTest.
# No asumir que el Team ID siempre coincide con el App ID prefix.
app-attest.app-id=${APP_ATTEST_APP_ID:}

# Debe coincidir con com.apple.developer.devicecheck.appattest-environment:
# Debug -> development; Beta/TestFlight y Release -> production.
# Para probar la app en Debug, definir APP_ATTEST_ENVIRONMENT=development.
app-attest.environment=${APP_ATTEST_ENVIRONMENT:production}

# Certificado raiz publico oficial de Apple, incluido en este directorio.
# Fuente: https://www.apple.com/certificateauthority/Apple_App_Attestation_Root_CA.pem
app-attest.root-certificate=classpath:apple-app-attest-root.pem

# Texto Base64 de la misma clave AES usada para cifrar la configuracion iOS.
# Debug: CONFIG_AES_KEY_DEV de resources/env-config/debug.xcconfig.
# Beta: CONFIG_AES_KEY_QA de resources/env-config/beta.xcconfig.
# Definirla en el entorno del proceso Java; no guardar secretos aqui.
app-attest.aes-key=${APP_ATTEST_AES_KEY:}
